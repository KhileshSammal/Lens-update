<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.9" />
  
  <!-- Latitude Grid / Inner Lens Ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#f4f4f5" stroke-width="1.5" opacity="0.8" />
  <circle cx="32" cy="32" r="6" fill="#f59e0b" opacity="0.95" />
  
  <!-- Cardinal Ticks (North, East, South, West) -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="58" y2="32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Camera Aperture Subtle Blades -->
  <line x1="22" y1="22" x2="26" y2="28" stroke="#f4f4f5" stroke-width="1.2" opacity="0.6" />
  <line x1="42" y1="22" x2="36" y2="28" stroke="#f4f4f5" stroke-width="1.2" opacity="0.6" />
  <line x1="42" y1="42" x2="38" y2="36" stroke="#f4f4f5" stroke-width="1.2" opacity="0.6" />
  <line x1="22" y1="42" x2="28" y2="36" stroke="#f4f4f5" stroke-width="1.2" opacity="0.6" />
</svg>
