<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="compassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- High-contrast dark background tile with smooth squircle border -->
  <rect width="64" height="64" rx="16" fill="#09090b" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.3"/>
  
  <!-- Outer Latitude & Longitude Navigation Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.85" />
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="2 3" />

  <!-- Four Cardinal Pointer Ticks -->
  <line x1="32" y1="5" x2="32" y2="10" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="59" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="10" y2="32" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="59" y2="32" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Minimalist Geometric Compass Needle -->
  <!-- North Arrow (Vibrant Golden Amber) -->
  <polygon points="32,10 37,32 32,28" fill="url(#compassGold)" />
  <polygon points="32,10 27,32 32,28" fill="#f59e0b" />

  <!-- South Arrow (Crisp Explorer Silver) -->
  <polygon points="32,54 37,32 32,36" fill="url(#needleLight)" opacity="0.95" />
  <polygon points="32,54 27,32 32,36" fill="#94a3b8" opacity="0.9" />

  <!-- East/West Star Wings -->
  <polygon points="54,32 32,36 32,32" fill="#fbbf24" opacity="0.75" />
  <polygon points="10,32 32,36 32,32" fill="#e2e8f0" opacity="0.75" />

  <!-- Center Lens Hub -->
  <circle cx="32" cy="32" r="4.5" fill="#09090b" stroke="#fbbf24" stroke-width="2" />
  <circle cx="32" cy="32" r="1.8" fill="#fbbf24" />
</svg>
